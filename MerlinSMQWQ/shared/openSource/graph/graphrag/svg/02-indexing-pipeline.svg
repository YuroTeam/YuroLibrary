<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="a2g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font-size:28px;font-weight:700;fill:#0f172a}
      .sub{font-size:14px;fill:#64748b}
      .step-n{font-size:13px;font-weight:700;fill:#15803d}
      .step-t{font-size:14px;font-weight:700;fill:#14532d}
      .step-d{font-size:11px;fill:#3f6212}
      .art{font-size:11.5px;font-weight:700;fill:#334155}
      .note{font-size:12px;fill:#475569}
      .band{font-size:13px;font-weight:700;letter-spacing:.06em}
    </style>
  </defs>
  <rect width="1240" height="760" fill="#f8fafc"/>
  <text x="60" y="50" class="title">索引管道 · Indexing Pipeline (标准)</text>
  <text x="60" y="74" class="sub">index/workflows/factory.py — 有序 workflow 列表；workflow 间通过共享 TableProvider 命名表通信</text>

  <g>
    <rect x="60" y="100" width="560" height="46" rx="9" fill="#ecfccb" stroke="#a3e635" stroke-width="1.5"/>
    <text x="80" y="128" class="step-n" fill="#4d7c0f">0</text>
    <text x="108" y="122" class="step-t">load_input_documents</text>
    <text x="108" y="138" class="step-d">加载源文档（更新模式用 load_update_documents）</text>

    <rect x="60" y="158" width="560" height="46" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="186" class="step-n">1</text>
    <text x="108" y="180" class="step-t">create_base_text_units</text>
    <text x="108" y="196" class="step-d">文档按 token 分块为 text units (graphrag_chunking)</text>

    <rect x="60" y="216" width="560" height="46" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="244" class="step-n">2</text>
    <text x="108" y="238" class="step-t">create_final_documents</text>
    <text x="108" y="254" class="step-d">终态化 documents 表（含 text-unit id 映射）</text>

    <rect x="60" y="274" width="560" height="46" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="302" class="step-n">3</text>
    <text x="108" y="296" class="step-t">extract_graph  ⚡LLM</text>
    <text x="108" y="312" class="step-d">抽取实体+关系，再 LLM 摘要描述</text>

    <rect x="60" y="332" width="560" height="46" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="360" class="step-n">4</text>
    <text x="108" y="354" class="step-t">finalize_graph</text>
    <text x="108" y="370" class="step-d">计算节点度数，终态化实体/关系（可选 GraphML 快照）</text>

    <rect x="60" y="390" width="560" height="46" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="418" class="step-n">5</text>
    <text x="108" y="412" class="step-t">extract_covariates  ⚡LLM</text>
    <text x="108" y="428" class="step-d">抽取声明 claims → covariates 表（默认可关闭）</text>

    <rect x="60" y="448" width="560" height="46" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="476" class="step-n">6</text>
    <text x="108" y="470" class="step-t">create_communities</text>
    <text x="108" y="486" class="step-d">层次化 Leiden 聚类 → 社区树 (graphs/hierarchical_leiden)</text>

    <rect x="60" y="506" width="560" height="46" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="534" class="step-n">7</text>
    <text x="108" y="528" class="step-t">create_final_text_units</text>
    <text x="108" y="544" class="step-d">用实体/关系/声明引用富化 text units</text>

    <rect x="60" y="564" width="560" height="46" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="592" class="step-n">8</text>
    <text x="108" y="586" class="step-t">create_community_reports  ⚡LLM</text>
    <text x="108" y="602" class="step-d">为每个社区生成摘要报告</text>

    <rect x="60" y="622" width="560" height="46" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="650" class="step-n">9</text>
    <text x="108" y="644" class="step-t">generate_text_embeddings</text>
    <text x="108" y="660" class="step-d">选定字段嵌入向量库 (text_unit / entity / community)</text>
  </g>

  <g stroke="#16a34a" stroke-width="1.8" marker-end="url(#a2)">
    <line x1="340" y1="146" x2="340" y2="157"/>
    <line x1="340" y1="204" x2="340" y2="215"/>
    <line x1="340" y1="262" x2="340" y2="273"/>
    <line x1="340" y1="320" x2="340" y2="331"/>
    <line x1="340" y1="378" x2="340" y2="389"/>
    <line x1="340" y1="436" x2="340" y2="447"/>
    <line x1="340" y1="494" x2="340" y2="505"/>
    <line x1="340" y1="552" x2="340" y2="563"/>
    <line x1="340" y1="610" x2="340" y2="621"/>
  </g>

  <g>
    <rect x="680" y="100" width="220" height="568" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="690" y="124" class="band" fill="#475569">产出 parquet 制品</text>
    <g>
      <rect x="700" y="140" width="180" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="712" y="162" class="art">documents</text>
      <rect x="700" y="182" width="180" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="712" y="204" class="art">text_units</text>
      <rect x="700" y="224" width="180" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="712" y="246" class="art">entities</text>
      <rect x="700" y="266" width="180" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="712" y="288" class="art">relationships</text>
      <rect x="700" y="308" width="180" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="712" y="330" class="art">covariates</text>
      <rect x="700" y="350" width="180" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="712" y="372" class="art">communities</text>
      <rect x="700" y="392" width="180" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="712" y="414" class="art">community_reports</text>
      <rect x="700" y="434" width="180" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="712" y="456" class="art">向量嵌入库</text>
      <rect x="700" y="476" width="180" height="52" rx="6" fill="#eef2ff" stroke="#a5b4fc"/><text x="712" y="497" class="art" fill="#3730a3">graph.graphml</text><text x="712" y="513" class="step-d" fill="#4338ca">快照 (可选)</text>
      <rect x="700" y="536" width="180" height="52" rx="6" fill="#eef2ff" stroke="#a5b4fc"/><text x="712" y="557" class="art" fill="#3730a3">stats.json</text><text x="712" y="573" class="step-d" fill="#4338ca">context.json (state)</text>
    </g>
  </g>
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a2g)">
    <line x1="620" y1="235" x2="698" y2="199"/>
    <line x1="620" y1="181" x2="698" y2="157"/>
    <line x1="620" y1="297" x2="698" y2="241"/>
    <line x1="620" y1="355" x2="698" y2="283"/>
    <line x1="620" y1="413" x2="698" y2="325"/>
    <line x1="620" y1="471" x2="698" y2="367"/>
    <line x1="620" y1="587" x2="698" y2="409"/>
    <line x1="620" y1="645" x2="698" y2="451"/>
  </g>

  <g>
    <rect x="940" y="100" width="240" height="230" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="954" y="124" class="band" fill="#ea580c">Fast / NLP 变体</text>
    <text x="954" y="150" class="note" fill="#9a3412">③ extract_graph_nlp</text>
    <text x="966" y="167" class="step-d" fill="#b45309">名词短语图 · 无 LLM</text>
    <text x="954" y="190" class="note" fill="#9a3412">+ prune_graph 剪枝</text>
    <text x="954" y="213" class="note" fill="#9a3412">− 去掉 extract_covariates</text>
    <text x="954" y="236" class="note" fill="#9a3412">⑧ create_community_</text>
    <text x="954" y="252" class="note" fill="#9a3412">    reports_text</text>
    <text x="966" y="269" class="step-d" fill="#b45309">基于 text unit 而非图</text>
    <text x="954" y="300" class="step-d" fill="#c2410c">IndexingMethod.Fast</text>
    <text x="954" y="318" class="step-d" fill="#c2410c">— 快速、低成本、无声明</text>

    <rect x="940" y="346" width="240" height="322" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="954" y="370" class="band" fill="#2563eb">增量更新变体</text>
    <text x="954" y="394" class="step-d" fill="#1d4ed8">对新文档增量跑完整管道，</text>
    <text x="954" y="410" class="step-d" fill="#1d4ed8">再追加合并链 _update_workflows：</text>
    <g font-size="11.5px" fill="#1e40af">
      <text x="962" y="434">update_final_documents</text>
      <text x="962" y="454">update_entities_relationships</text>
      <text x="962" y="474">update_text_units</text>
      <text x="962" y="494">update_covariates</text>
      <text x="962" y="514">update_communities</text>
      <text x="962" y="534">update_community_reports</text>
      <text x="962" y="554">update_text_embeddings</text>
      <text x="962" y="574">update_clean_state</text>
    </g>
    <text x="954" y="606" class="step-d" fill="#1d4ed8">delta/ + previous/ 双表集，</text>
    <text x="954" y="622" class="step-d" fill="#1d4ed8">合并而非全量重建。</text>
    <text x="954" y="650" class="step-d" fill="#2563eb">StandardUpdate / FastUpdate</text>
  </g>
</svg>
