<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <style>
      .title{font-size:28px;font-weight:700;fill:#0f172a}
      .sub{font-size:14px;fill:#64748b}
      .cls{font-size:11.5px;font-weight:700;fill:#c2410c;font-family:'SF Mono',Consolas,monospace}
      .d{font-size:12px;fill:#7c2d12}
      .tag{font-size:11px;font-weight:700;fill:#fff}
      .src{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1240" height="720" fill="#f8fafc"/>
  <text x="60" y="50" class="title">查询子系统 · 四种检索策略</text>
  <text x="60" y="74" class="sub">query/structured_search — 共享 BaseSearch 抽象与统一流式接口；各配专属 ContextBuilder，经 api/query.py 调用</text>

  <rect x="60" y="96" width="1120" height="40" rx="9" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="80" y="121" font-size="13px" font-weight="700" fill="#b91c1c">BaseSearch(ABC) · SearchResult · search() / stream_search()  —  model(LLMCompletion) + context_builder + tokenizer</text>

  <!-- Local -->
  <g>
    <rect x="60" y="156" width="540" height="250" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="60" y="156" width="540" height="34" rx="12" fill="#fb923c"/>
    <rect x="60" y="176" width="540" height="14" fill="#fb923c"/>
    <text x="80" y="179" class="tag" font-size="13px">LOCAL SEARCH · 实体局部问题</text>
    <text x="80" y="216" class="cls">LocalSearch + LocalSearchMixedContext</text>
    <text x="80" y="244" class="d">① query 嵌入 → map_query_to_entities</text>
    <text x="92" y="262" class="d" fill="#9a3412">对实体描述向量库取 top-k 最近实体</text>
    <text x="80" y="286" class="d">② 组装「混合上下文」：</text>
    <text x="92" y="304" class="d" fill="#9a3412">社区报告 + 实体/关系/声明表 + 关联原文</text>
    <text x="80" y="328" class="d">③ 按 community_prop / text_unit_prop</text>
    <text x="92" y="346" class="d" fill="#9a3412">分配 max_context_tokens 预算</text>
    <text x="80" y="374" class="d" font-weight="700">→ 单次 LLM 调用 (single-shot)</text>
    <text x="80" y="396" class="src">local_search/mixed_context.py</text>
  </g>

  <!-- Global -->
  <g>
    <rect x="640" y="156" width="540" height="250" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="640" y="156" width="540" height="34" rx="12" fill="#f97316"/>
    <rect x="640" y="176" width="540" height="14" fill="#f97316"/>
    <text x="660" y="179" class="tag" font-size="13px">GLOBAL SEARCH · 全局主题问题</text>
    <text x="660" y="216" class="cls">GlobalSearch + GlobalCommunityContext</text>
    <text x="660" y="244" class="d">社区报告摘要分批 (可选 LLM 动态选社区)</text>
    <text x="660" y="272" class="d" font-weight="700">MAP：</text>
    <text x="712" y="272" class="d">并行 (Semaphore 限流) 对每批出</text>
    <text x="672" y="290" class="d" fill="#9a3412">JSON 要点 + 重要度分</text>
    <text x="660" y="318" class="d" font-weight="700">REDUCE：</text>
    <text x="728" y="318" class="d">滤 0 分 → 按分排序 →</text>
    <text x="672" y="336" class="d" fill="#9a3412">截断 max_data_tokens → 终局合成</text>
    <text x="660" y="374" class="d" font-weight="700">→ Map-Reduce (多次 LLM 调用)</text>
    <text x="660" y="396" class="src">global_search/community_context.py</text>
  </g>

  <!-- DRIFT -->
  <g>
    <rect x="60" y="426" width="540" height="266" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="60" y="426" width="540" height="34" rx="12" fill="#ea580c"/>
    <rect x="60" y="446" width="540" height="14" fill="#ea580c"/>
    <text x="80" y="449" class="tag" font-size="13px">DRIFT SEARCH · 复杂多跳推理</text>
    <text x="80" y="486" class="cls">DRIFTSearch + DRIFTSearchContextBuilder</text>
    <text x="80" y="512" class="d">全局定调 + 迭代局部跟进</text>
    <text x="80" y="536" class="d">① PrimerQueryProcessor：HyDE 扩展</text>
    <text x="92" y="554" class="d" fill="#9a3412">→ cos 排序选 top-k 社区报告</text>
    <text x="80" y="578" class="d">② DRIFTPrimer.decompose_query</text>
    <text x="92" y="596" class="d" fill="#9a3412">→ 初始答案 + 跟进问题</text>
    <text x="80" y="620" class="d">③ 主循环 QueryState (MultiDiGraph)：</text>
    <text x="92" y="638" class="d" fill="#9a3412">每轮执行 top drift_k_followups (内部 LocalSearch)</text>
    <text x="80" y="662" class="d" font-weight="700">→ 至多 n_depth 轮 + 最终 reduce</text>
    <text x="80" y="683" class="src">drift_search/{primer,drift_context,state}.py</text>
  </g>

  <!-- Basic -->
  <g>
    <rect x="640" y="426" width="540" height="266" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="640" y="426" width="540" height="34" rx="12" fill="#fdba74"/>
    <rect x="640" y="446" width="540" height="14" fill="#fdba74"/>
    <text x="660" y="449" class="tag" font-size="13px" fill="#7c2d12">BASIC SEARCH · 直接段落检索 / 基线</text>
    <text x="660" y="486" class="cls">BasicSearch + BasicSearchContext</text>
    <text x="660" y="514" class="d">纯向量 RAG — 完全忽略图谱</text>
    <text x="660" y="542" class="d">① similarity_search_by_text</text>
    <text x="672" y="560" class="d" fill="#9a3412">对 text_unit 嵌入库取 top-k 文本块</text>
    <text x="660" y="588" class="d">② 打包为 CSV 上下文</text>
    <text x="672" y="606" class="d" fill="#9a3412">直到 max_context_tokens</text>
    <text x="660" y="640" class="d" font-weight="700">→ 单次 LLM 调用</text>
    <text x="660" y="683" class="src">basic_search/basic_context.py</text>
  </g>

  <g stroke="#ea580c" stroke-width="1.6" marker-end="url(#ao)">
    <line x1="330" y1="136" x2="330" y2="154"/>
    <line x1="910" y1="136" x2="910" y2="154"/>
  </g>
</svg>
