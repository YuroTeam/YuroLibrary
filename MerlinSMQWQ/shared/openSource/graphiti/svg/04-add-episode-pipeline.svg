<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1340" viewBox="0 0 1160 1340" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="flowMap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="flowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c53030"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="1340" fill="#f8fafc"/>

  <!-- Title -->
  <text x="580" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#1e293b">Graphiti 数据写入管道 · add_episode 全流程</text>
  <text x="580" y="72" text-anchor="middle" font-size="14" fill="#64748b">一段原始文本 → 抽实体 → 去重 → 抽关系 + 时序失效 → 落库（双时态知识图谱）</text>

  <!-- Legend -->
  <g font-size="12.5">
    <rect x="748" y="92" width="15" height="15" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="770" y="104" fill="#475569">🧠 LLM 调用</text>
    <rect x="858" y="92" width="15" height="15" rx="3" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="880" y="104" fill="#475569">💾 数据库读/写</text>
    <rect x="988" y="92" width="15" height="15" rx="3" fill="#fef2f2" stroke="#c53030"/>
    <text x="1010" y="104" fill="#475569">⏳ 时态处理</text>
  </g>

  <!-- ===== INPUT ===== -->
  <rect x="410" y="128" width="340" height="58" rx="12" fill="#1e293b"/>
  <text x="580" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">输入 Episode</text>
  <text x="580" y="174" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-family="monospace">name · episode_body · reference_time</text>
  <line x1="580" y1="186" x2="580" y2="212" stroke="#475569" stroke-width="2.2" marker-end="url(#flow)"/>

  <!-- ===== ① Prepare ===== -->
  <rect x="330" y="214" width="500" height="78" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="350" y="240" font-size="15" font-weight="700" fill="#075985">① 准备上下文</text>
  <text x="758" y="240" text-anchor="end" font-size="11.5" fill="#0284c7">💾</text>
  <text x="350" y="262" font-size="12.5" fill="#334155">• retrieve_episodes()：拉最近 N 条历史 episode 作上下文（帮 LLM 理解指代）</text>
  <text x="350" y="282" font-size="12.5" fill="#334155">• 创建 <tspan font-family="monospace" fill="#0369a1">EpisodicNode</tspan>（原始素材，valid_at = reference_time）</text>
  <line x1="580" y1="292" x2="580" y2="316" stroke="#475569" stroke-width="2.2" marker-end="url(#flow)"/>

  <!-- ===== ② Extract nodes ===== -->
  <rect x="300" y="318" width="560" height="118" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="344" font-size="15" font-weight="700" fill="#6d28d9">② 抽取节点  extract_nodes()</text>
  <text x="838" y="344" text-anchor="end" font-size="12" fill="#7c3aed">🧠 LLM</text>
  <text x="320" y="368" font-size="12.5" fill="#334155">原文 + 历史 + 自定义 entity_types  ──LLM──▶  实体列表（名字 + 类型分类）</text>
  <text x="320" y="390" font-size="12.5" fill="#334155">• 过滤空名 → _create_entity_nodes 转成 <tspan font-family="monospace" fill="#6d28d9">EntityNode</tspan>（记录来自哪几条 episode）</text>
  <text x="320" y="411" font-size="12.5" fill="#334155">• _collapse_exact_duplicate：折叠本次抽取里名字完全相同的</text>
  <rect x="320" y="418" width="520" height="10" rx="0" fill="none"/>
  <text x="580" y="426" text-anchor="middle" font-size="11.5" font-style="italic" fill="#7c3aed">产出：一批「候选」EntityNode（尚未与图中已有实体比对，可能重复）</text>
  <line x1="580" y1="436" x2="580" y2="460" stroke="#475569" stroke-width="2.2" marker-end="url(#flow)"/>

  <!-- ===== ③ Resolve nodes (dedup) ===== -->
  <rect x="250" y="462" width="660" height="168" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="488" font-size="15" font-weight="700" fill="#6d28d9">③ 节点去重  resolve_extracted_nodes()</text>
  <text x="888" y="488" text-anchor="end" font-size="12" fill="#7c3aed">🧠 LLM</text>
  <text x="270" y="509" font-size="12.5" fill="#475569">目标：候选实体 vs 图中已有实体 → 老实体复用、新实体才建（「张三」不会每次都新建）</text>
  <!-- three tier boxes -->
  <rect x="270" y="520" width="200" height="66" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="370" y="540" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">1. 语义检索候选</text>
  <text x="370" y="558" text-anchor="middle" font-size="11" fill="#64748b">嵌入 + 全文，从图里</text>
  <text x="370" y="572" text-anchor="middle" font-size="11" fill="#64748b">搜出可能相同的老实体 💾</text>

  <rect x="480" y="520" width="200" height="66" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="580" y="540" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">2. 相似度去重</text>
  <text x="580" y="558" text-anchor="middle" font-size="11" fill="#64748b">嵌入足够近 → 直接判同</text>
  <text x="580" y="572" text-anchor="middle" font-size="11" fill="#16a34a">（省掉 LLM，便宜）</text>

  <rect x="690" y="520" width="200" height="66" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="790" y="540" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">3. LLM 去重</text>
  <text x="790" y="558" text-anchor="middle" font-size="11" fill="#64748b">拿不准的交给 LLM</text>
  <text x="790" y="572" text-anchor="middle" font-size="11" fill="#64748b">判断是否同一实体 🧠</text>

  <text x="270" y="606" font-size="12.5" font-weight="600" fill="#7c3aed">产出：去重后的 nodes  +  uuid_map（候选uuid → 图中真实uuid）</text>
  <text x="270" y="623" font-size="11.5" fill="#64748b">uuid_map 例：临时「张三」A 判定 = 库里「张三」X ⟹ uuid_map[A]=X（第④步给边改指向要用）</text>

  <line x1="580" y1="630" x2="580" y2="656" stroke="#475569" stroke-width="2.2" marker-end="url(#flow)"/>

  <!-- ===== ④ Extract + resolve edges ===== -->
  <rect x="210" y="658" width="740" height="292" rx="12" fill="#fdf4ff" stroke="#a21caf" stroke-width="2.2"/>
  <text x="230" y="684" font-size="15.5" font-weight="700" fill="#86198f">④ 抽取 + 解析边  _extract_and_resolve_edges()  —— 最复杂的一步</text>

  <!-- 4.1 -->
  <rect x="230" y="700" width="700" height="60" rx="9" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="248" y="722" font-size="13.5" font-weight="700" fill="#7c3aed">4.1 抽取边 extract_edges 🧠</text>
  <text x="248" y="744" font-size="12" fill="#334155">在已抽实体之间找事实关系，每条生成 <tspan font-family="monospace" fill="#86198f">EntityEdge</tspan>：fact「张三 入职 A公司」+ 源/目标 uuid + valid_at/invalid_at（时态）</text>

  <!-- 4.2 -->
  <rect x="230" y="768" width="700" height="52" rx="9" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="248" y="789" font-size="13.5" font-weight="700" fill="#7c3aed">4.2 重定向指针 resolve_edge_pointers</text>
  <text x="600" y="789" font-size="11.5" fill="#7c3aed">▲ 用 uuid_map</text>
  <text x="248" y="809" font-size="12" fill="#334155">把边两端 uuid 换成去重后的真实实体 uuid（否则边会指向已被丢弃的临时节点）</text>

  <!-- 4.3 -->
  <rect x="230" y="828" width="700" height="106" rx="9" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="248" y="850" font-size="13.5" font-weight="700" fill="#7c3aed">4.3 边去重 + 时序失效 resolve_extracted_edges 🧠 ⏳</text>
  <text x="248" y="871" font-size="12" fill="#334155">• 精确去重 (源,目标,fact) → 查已有边 get_between_nodes 💾 + 混合检索找重复/可被推翻的边</text>
  <text x="248" y="891" font-size="12" fill="#334155">• LLM 判定：是重复→复用老边；<tspan fill="#c53030" font-weight="600">矛盾/推翻旧事实→给旧边设 invalid_at + expired_at（不删除！）</tspan></text>
  <text x="248" y="911" font-size="12" fill="#334155">• 双时态精髓：事实有「现实何时有效 valid/invalid_at」+「系统何时记录/失效 created/expired_at」两条时间线</text>
  <text x="580" y="928" text-anchor="middle" font-size="11.5" font-style="italic" fill="#86198f">返回：resolved_edges（全部）· invalidated_edges（被推翻的旧边）· new_edges（真正新增）</text>

  <line x1="580" y1="950" x2="580" y2="976" stroke="#475569" stroke-width="2.2" marker-end="url(#flow)"/>

  <!-- ===== ⑤ Attributes ===== -->
  <rect x="300" y="978" width="560" height="88" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="1004" font-size="15" font-weight="700" fill="#6d28d9">⑤ 节点属性水合  extract_attributes_from_nodes()</text>
  <text x="838" y="1004" text-anchor="end" font-size="12" fill="#7c3aed">🧠 LLM</text>
  <text x="320" y="1027" font-size="12.5" fill="#334155">• LLM 生成实体 summary + 自定义属性；生成 name embedding（供以后检索/去重）</text>
  <text x="320" y="1048" font-size="12.5" fill="#334155">• 只传 new_edges 进来 → 避免把图里已有旧事实重复写进摘要</text>
  <line x1="580" y1="1066" x2="580" y2="1092" stroke="#475569" stroke-width="2.2" marker-end="url(#flow)"/>

  <!-- ===== ⑥ Persist ===== -->
  <rect x="300" y="1094" width="560" height="98" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="320" y="1120" font-size="15" font-weight="700" fill="#075985">⑥ 持久化  _process_episode_data()</text>
  <text x="838" y="1120" text-anchor="end" font-size="12" fill="#0284c7">💾 写库</text>
  <text x="320" y="1143" font-size="12.5" fill="#334155">• build_episodic_edges：建 <tspan font-family="monospace" fill="#0369a1">MENTIONS</tspan> 边（本 episode → 提到的每个实体）</text>
  <text x="320" y="1163" font-size="12.5" fill="#334155">• 可选 saga：HAS_EPISODE / NEXT_EPISODE 边串联</text>
  <text x="320" y="1183" font-size="12.5" fill="#334155">• 节点 + 边 + episode 批量 bulk 写入 Neo4j / FalkorDB ...</text>
  <line x1="580" y1="1192" x2="580" y2="1216" stroke="#475569" stroke-width="2.2" marker-end="url(#flow)"/>

  <!-- ===== ⑦ Output ===== -->
  <rect x="360" y="1218" width="440" height="70" rx="12" fill="#0f766e"/>
  <text x="580" y="1244" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">输出 AddEpisodeResults</text>
  <text x="580" y="1266" text-anchor="middle" font-size="12" fill="#ccfbf1" font-family="monospace">episode · nodes · edges · episodic_edges · communities</text>
  <text x="580" y="1281" text-anchor="middle" font-size="11" fill="#99f6e4">（⑦ 可选：update_communities=True 时把新实体并入社区）</text>

  <!-- Side note on node/edge types -->
  <rect x="40" y="700" width="150" height="250" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="115" y="722" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">图里存什么</text>
  <line x1="56" y1="732" x2="174" y2="732" stroke="#e2e8f0"/>
  <text x="52" y="752" font-size="11" font-weight="700" fill="#7c3aed">节点 Node</text>
  <text x="52" y="770" font-size="10.5" fill="#475569">EpisodicNode 原始素材</text>
  <text x="52" y="786" font-size="10.5" fill="#475569">EntityNode 抽出的实体</text>
  <text x="52" y="802" font-size="10.5" fill="#475569">CommunityNode 社区</text>
  <line x1="56" y1="816" x2="174" y2="816" stroke="#e2e8f0"/>
  <text x="52" y="836" font-size="11" font-weight="700" fill="#86198f">边 Edge</text>
  <text x="52" y="854" font-size="10.5" fill="#475569">MENTIONS</text>
  <text x="52" y="868" font-size="10" fill="#94a3b8">episode→实体</text>
  <text x="52" y="886" font-size="10.5" fill="#475569">RELATES_TO</text>
  <text x="52" y="900" font-size="10" fill="#94a3b8">实体→实体(事实)</text>
  <text x="52" y="918" font-size="10.5" fill="#475569">HAS/NEXT_EPISODE</text>
  <text x="52" y="936" font-size="10" fill="#94a3b8">saga 串联</text>

  <!-- Side note: dedup + temporal are the two hard problems -->
  <rect x="970" y="462" width="150" height="168" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="1045" y="484" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">两大难点</text>
  <line x1="986" y1="494" x2="1104" y2="494" stroke="#fcd34d"/>
  <text x="984" y="514" font-size="11" font-weight="700" fill="#7c3aed">① 去重</text>
  <text x="984" y="531" font-size="10.5" fill="#475569">同一实体/关系</text>
  <text x="984" y="546" font-size="10.5" fill="#475569">不重复入图</text>
  <text x="984" y="576" font-size="11" font-weight="700" fill="#c53030">② 时态</text>
  <text x="984" y="593" font-size="10.5" fill="#475569">旧事实被推翻时</text>
  <text x="984" y="608" font-size="10.5" fill="#475569">标失效而非删除，</text>
  <text x="984" y="623" font-size="10.5" fill="#475569">保留完整历史</text>
</svg>
