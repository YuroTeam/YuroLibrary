<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="gNeo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ff7"/>
      <stop offset="1" stop-color="#3b6fd4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="760" fill="#f8fafc"/>

  <!-- Title -->
  <text x="460" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Graphiti · Neo4jDriver 架构图</text>
  <text x="460" y="70" text-anchor="middle" font-size="14" fill="#64748b">上层业务 → 抽象接口 → 可替换后端 → 图数据库</text>

  <!-- Layer 1: Business code -->
  <rect x="260" y="100" width="400" height="66" rx="12" fill="#1e293b"/>
  <text x="460" y="132" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Graphiti 上层业务代码</text>
  <text x="460" y="154" text-anchor="middle" font-size="13" fill="#cbd5e1">「帮我存节点 / 查询 / 搜索」</text>

  <!-- arrow 1->2 -->
  <line x1="460" y1="166" x2="460" y2="204" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="474" y="190" font-size="12" fill="#64748b">只依赖接口，不碰数据库</text>

  <!-- Layer 2: GraphDriver interface -->
  <rect x="210" y="208" width="500" height="94" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="460" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">GraphDriver（抽象接口 / ABC）</text>
  <text x="460" y="260" text-anchor="middle" font-size="13" fill="#475569">定义「一个 driver 必须会做什么」</text>
  <text x="460" y="284" text-anchor="middle" font-size="12.5" fill="#6366f1" font-family="monospace">execute_query · session · transaction · close · build_indices</text>

  <!-- arrow interface -> implementations -->
  <line x1="460" y1="302" x2="460" y2="330" stroke="#64748b" stroke-width="2"/>
  <text x="474" y="322" font-size="12" fill="#64748b">具体实现（可替换）</text>
  <line x1="150" y1="330" x2="770" y2="330" stroke="#64748b" stroke-width="2"/>

  <!-- Layer 3: 4 implementations -->
  <!-- Neo4j (highlighted) -->
  <line x1="150" y1="330" x2="150" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="362" width="160" height="72" rx="10" fill="url(#gNeo)" stroke="#2f5bb0" stroke-width="2"/>
  <text x="150" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Neo4jDriver</text>
  <text x="150" y="414" text-anchor="middle" font-size="11.5" fill="#dbeafe">neo4j_driver.py · 本文重点</text>

  <!-- FalkorDB -->
  <line x1="357" y1="330" x2="357" y2="360" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrowLight)"/>
  <rect x="277" y="362" width="160" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="357" y="392" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">FalkorDBDriver</text>
  <text x="357" y="414" text-anchor="middle" font-size="11.5" fill="#94a3b8">falkordb_driver.py</text>

  <!-- Kuzu -->
  <line x1="563" y1="330" x2="563" y2="360" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrowLight)"/>
  <rect x="483" y="362" width="160" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="563" y="392" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">KuzuDriver</text>
  <text x="563" y="414" text-anchor="middle" font-size="11.5" fill="#94a3b8">kuzu_driver.py</text>

  <!-- Neptune -->
  <line x1="770" y1="330" x2="770" y2="360" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrowLight)"/>
  <rect x="690" y="362" width="160" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="770" y="392" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">NeptuneDriver</text>
  <text x="770" y="414" text-anchor="middle" font-size="11.5" fill="#94a3b8">neptune_driver.py</text>

  <!-- arrow Neo4jDriver -> DB -->
  <line x1="150" y1="434" x2="150" y2="628" stroke="#3b6fd4" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="164" y="500" font-size="12" fill="#3b6fd4">官方 neo4j 库</text>
  <text x="164" y="518" font-size="12" fill="#3b6fd4">+ Cypher 语句</text>
  <text x="164" y="536" font-size="12" fill="#3b6fd4">bolt://:7687</text>

  <!-- Neo4j database -->
  <rect x="70" y="630" width="360" height="90" rx="12" fill="#eff6ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="250" y="662" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">Neo4j 图数据库</text>
  <text x="250" y="686" text-anchor="middle" font-size="12.5" fill="#475569">用「节点 Node + 关系 Edge」存数据</text>
  <text x="250" y="706" text-anchor="middle" font-size="12.5" fill="#475569">(张三) —[住在]→ (北京)</text>

  <!-- Side panel: Neo4jDriver responsibilities -->
  <rect x="500" y="470" width="350" height="250" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="524" y="502" font-size="15" font-weight="700" fill="#1e293b">Neo4jDriver 主要职责</text>
  <line x1="524" y1="514" x2="826" y2="514" stroke="#e2e8f0" stroke-width="1"/>

  <circle cx="532" cy="540" r="4" fill="#3b6fd4"/>
  <text x="546" y="545" font-size="13" fill="#334155"><tspan font-weight="600">建立连接</tspan> — AsyncGraphDatabase.driver()</text>

  <circle cx="532" cy="572" r="4" fill="#3b6fd4"/>
  <text x="546" y="577" font-size="13" fill="#334155"><tspan font-weight="600">执行查询</tspan> — execute_query() 跑 Cypher</text>

  <circle cx="532" cy="604" r="4" fill="#3b6fd4"/>
  <text x="546" y="609" font-size="13" fill="#334155"><tspan font-weight="600">事务</tspan> — commit 成功 / rollback 回滚</text>

  <circle cx="532" cy="636" r="4" fill="#3b6fd4"/>
  <text x="546" y="641" font-size="13" fill="#334155"><tspan font-weight="600">建索引</tspan> — range + fulltext 加速检索</text>

  <circle cx="532" cy="668" r="4" fill="#3b6fd4"/>
  <text x="546" y="673" font-size="13" fill="#334155"><tspan font-weight="600">全程异步</tspan> — async / await 高并发</text>

  <circle cx="532" cy="700" r="4" fill="#3b6fd4"/>
  <text x="546" y="705" font-size="13" fill="#334155"><tspan font-weight="600">健康检查 / 关闭</tspan> — health_check / close</text>
</svg>
