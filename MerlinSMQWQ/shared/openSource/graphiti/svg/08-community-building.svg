<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1000" viewBox="0 0 1140 1000" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="c_arrow" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="c_teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1140" height="1000" fill="#f8fafc"/>

  <text x="570" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#1e293b">Graphiti 社区构建</text>
  <text x="570" y="72" text-anchor="middle" font-size="14" fill="#64748b">加权标签传播聚类 + 二叉树式层次化摘要</text>

  <!-- ===== full build flow (left column) ===== -->
  <text x="60" y="116" font-size="16" font-weight="700" fill="#1e293b">一、全量重建 build_communities（破坏性）</text>

  <rect x="60" y="132" width="360" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="240" y="159" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b91c1c">① 清空旧社区 DETACH DELETE (c:Community)</text>
  <line x1="240" y1="176" x2="240" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#c_arrow)"/>

  <rect x="60" y="198" width="360" height="44" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="240" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e">② 社区检测：标签传播 → 成员簇</text>
  <line x1="240" y1="242" x2="240" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#c_arrow)"/>

  <rect x="60" y="264" width="360" height="44" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="240" y="291" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6d28d9">③ 每簇 build_community（并发≤10）🧠</text>
  <line x1="240" y1="308" x2="240" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#c_arrow)"/>

  <rect x="60" y="330" width="360" height="44" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="240" y="357" text-anchor="middle" font-size="12.5" font-weight="600" fill="#059669">④ 生成 name_embedding</text>
  <line x1="240" y1="374" x2="240" y2="394" stroke="#475569" stroke-width="2" marker-end="url(#c_arrow)"/>

  <rect x="60" y="396" width="360" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="240" y="423" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">⑤ 批量落库 nodes + HAS_MEMBER 边 💾</text>

  <text x="60" y="472" font-size="11.5" fill="#64748b">※ 按 group_id 分别聚类，社区不跨 group</text>

  <!-- ===== label propagation (right of build) ===== -->
  <text x="470" y="116" font-size="16" font-weight="700" fill="#0f766e">二、标签传播算法（Label Propagation）</text>
  <rect x="470" y="132" width="610" height="216" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="490" y="158" font-size="12.5" fill="#475569">比喻：每人举着写自己编号的牌子，每轮改举「周围最流行的牌子」</text>
  <text x="490" y="176" font-size="12.5" fill="#475569">反复多轮，联系紧密的人趋于举同一块牌子 → 成一个社区</text>

  <!-- little nodes illustration -->
  <circle cx="540" cy="240" r="20" fill="#5eead4" stroke="#0d9488" stroke-width="1.6"/>
  <text x="540" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">A</text>
  <circle cx="620" cy="215" r="20" fill="#5eead4" stroke="#0d9488" stroke-width="1.6"/>
  <text x="620" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">A</text>
  <circle cx="620" cy="275" r="20" fill="#5eead4" stroke="#0d9488" stroke-width="1.6"/>
  <text x="620" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">A</text>
  <line x1="560" y1="235" x2="600" y2="220" stroke="#0d9488" stroke-width="3"/>
  <text x="576" y="222" font-size="9" fill="#0f766e">×3</text>
  <line x1="560" y1="245" x2="600" y2="270" stroke="#0d9488" stroke-width="5"/>
  <text x="576" y="268" font-size="9" fill="#0f766e">×5</text>
  <text x="490" y="316" font-size="11.5" fill="#334155">• 投票<tspan font-weight="700" fill="#0f766e">按边数加权</tspan>（边越多票越重），取最高票社区</text>
  <text x="490" y="334" font-size="11.5" fill="#334155">• 平票 → 选编号更大的　• 收敛：整轮无变动即停（无迭代上限）</text>

  <rect x="700" y="200" width="360" height="120" rx="10" fill="#ffffff" stroke="#99f6e4"/>
  <text x="716" y="222" font-size="11.5" font-weight="700" fill="#0f766e">带权邻接投影</text>
  <text x="716" y="243" font-size="10.5" fill="#475569" font-family="monospace">张三: [(李四,3), (A公司,5)]</text>
  <text x="716" y="261" font-size="10.5" fill="#475569" font-family="monospace">李四: [(张三,3), ...]</text>
  <text x="716" y="284" font-size="10.5" fill="#64748b">从 RELATES_TO 边统计到每个邻居的边数</text>
  <text x="716" y="304" font-size="10.5" fill="#64748b">作为权重（纯 Python 手写，不依赖 GDS 插件）</text>

  <!-- divider -->
  <line x1="60" y1="500" x2="1080" y2="500" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ===== hierarchical summary (tree) ===== -->
  <text x="60" y="532" font-size="16" font-weight="700" fill="#7c3aed">三、层次化摘要：成对归并成社区 summary 🌳</text>
  <text x="60" y="554" font-size="12.5" fill="#64748b">成员摘要两两经 LLM summarize_pair 逐层合并（像归并排序），信息层层浓缩，而非一次性塞给 LLM</text>

  <!-- tree: 8 -> 4 -> 2 -> 1 -->
  <!-- level 8 -->
  <g font-size="10.5" fill="#6d28d9" font-weight="600">
    <rect x="90" y="580" width="90" height="30" rx="6" fill="#faf5ff" stroke="#c4b5fd"/><text x="135" y="600" text-anchor="middle">成员1</text>
    <rect x="200" y="580" width="90" height="30" rx="6" fill="#faf5ff" stroke="#c4b5fd"/><text x="245" y="600" text-anchor="middle">成员2</text>
    <rect x="310" y="580" width="90" height="30" rx="6" fill="#faf5ff" stroke="#c4b5fd"/><text x="355" y="600" text-anchor="middle">成员3</text>
    <rect x="420" y="580" width="90" height="30" rx="6" fill="#faf5ff" stroke="#c4b5fd"/><text x="465" y="600" text-anchor="middle">成员4</text>
    <rect x="530" y="580" width="90" height="30" rx="6" fill="#faf5ff" stroke="#c4b5fd"/><text x="575" y="600" text-anchor="middle">成员5</text>
    <rect x="640" y="580" width="90" height="30" rx="6" fill="#faf5ff" stroke="#c4b5fd"/><text x="685" y="600" text-anchor="middle">成员6</text>
    <rect x="750" y="580" width="90" height="30" rx="6" fill="#faf5ff" stroke="#c4b5fd"/><text x="795" y="600" text-anchor="middle">成员7</text>
    <rect x="860" y="580" width="90" height="30" rx="6" fill="#faf5ff" stroke="#c4b5fd"/><text x="905" y="600" text-anchor="middle">成员8</text>
  </g>
  <!-- arrows 8->4 -->
  <g stroke="#a78bfa" stroke-width="1.6">
    <line x1="135" y1="610" x2="180" y2="642" marker-end="url(#c_arrow)"/>
    <line x1="245" y1="610" x2="200" y2="642" marker-end="url(#c_arrow)"/>
    <line x1="355" y1="610" x2="400" y2="642" marker-end="url(#c_arrow)"/>
    <line x1="465" y1="610" x2="420" y2="642" marker-end="url(#c_arrow)"/>
    <line x1="575" y1="610" x2="620" y2="642" marker-end="url(#c_arrow)"/>
    <line x1="685" y1="610" x2="640" y2="642" marker-end="url(#c_arrow)"/>
    <line x1="795" y1="610" x2="840" y2="642" marker-end="url(#c_arrow)"/>
    <line x1="905" y1="610" x2="860" y2="642" marker-end="url(#c_arrow)"/>
  </g>
  <text x="985" y="600" font-size="11" fill="#94a3b8">第1轮</text>
  <!-- level 4 -->
  <g font-size="10.5" fill="#6d28d9" font-weight="600">
    <rect x="145" y="644" width="90" height="30" rx="6" fill="#f3e8ff" stroke="#a78bfa"/><text x="190" y="664" text-anchor="middle">合并A</text>
    <rect x="365" y="644" width="90" height="30" rx="6" fill="#f3e8ff" stroke="#a78bfa"/><text x="410" y="664" text-anchor="middle">合并B</text>
    <rect x="585" y="644" width="90" height="30" rx="6" fill="#f3e8ff" stroke="#a78bfa"/><text x="630" y="664" text-anchor="middle">合并C</text>
    <rect x="805" y="644" width="90" height="30" rx="6" fill="#f3e8ff" stroke="#a78bfa"/><text x="850" y="664" text-anchor="middle">合并D</text>
  </g>
  <g stroke="#a78bfa" stroke-width="1.6">
    <line x1="190" y1="674" x2="290" y2="706" marker-end="url(#c_arrow)"/>
    <line x1="410" y1="674" x2="310" y2="706" marker-end="url(#c_arrow)"/>
    <line x1="630" y1="674" x2="730" y2="706" marker-end="url(#c_arrow)"/>
    <line x1="850" y1="674" x2="750" y2="706" marker-end="url(#c_arrow)"/>
  </g>
  <text x="985" y="664" font-size="11" fill="#94a3b8">第2轮</text>
  <!-- level 2 -->
  <g font-size="10.5" fill="#6d28d9" font-weight="600">
    <rect x="255" y="708" width="90" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6"/><text x="300" y="728" text-anchor="middle">合并AB</text>
    <rect x="695" y="708" width="90" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6"/><text x="740" y="728" text-anchor="middle">合并CD</text>
  </g>
  <g stroke="#8b5cf6" stroke-width="1.8">
    <line x1="300" y1="738" x2="510" y2="770" marker-end="url(#c_arrow)"/>
    <line x1="740" y1="738" x2="570" y2="770" marker-end="url(#c_arrow)"/>
  </g>
  <text x="985" y="728" font-size="11" fill="#94a3b8">第3轮</text>
  <!-- final -->
  <rect x="420" y="772" width="240" height="42" rx="8" fill="#7c3aed"/>
  <text x="540" y="792" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">社区 summary（最终一条）</text>
  <text x="540" y="808" text-anchor="middle" font-size="10" fill="#ddd6fe">再由 summary_description → 生成社区 name</text>

  <!-- ===== incremental update ===== -->
  <rect x="60" y="838" width="1020" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="864" font-size="15" font-weight="700" fill="#b45309">四、增量更新 update_community（add_episode 里 update_communities=True）</text>
  <text x="80" y="888" font-size="12" fill="#334155">新实体来了，<tspan font-weight="700">不跑标签传播、不重新划分</tspan>，而是「就近归入」已有社区：</text>
  <text x="96" y="910" font-size="11.5" fill="#475569">① 已属于某社区？ → 直接返回（不建新边）　② 否则看邻居所属社区，<tspan font-weight="700" fill="#b45309">众数投票</tspan>选出最多的那个</text>
  <text x="96" y="930" font-size="11.5" fill="#475569">③ 周围无已入社区邻居 → 暂不加入　④ 否则建 HAS_MEMBER 边 + summarize_pair 合并摘要 + 重算 embedding</text>
  <text x="80" y="958" font-size="11.5" font-weight="600" fill="#b45309">⚠️ 增量只会把新实体挂到现有社区，要重新划分必须重跑全量 build_communities</text>
</svg>
