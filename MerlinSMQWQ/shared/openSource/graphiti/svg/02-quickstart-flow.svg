<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" font-family="'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="1180" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#f1f5f9">Quickstart 执行流程图</text>
  <text x="600" y="72" text-anchor="middle" font-size="13.5" fill="#94a3b8">examples/quickstart/quickstart_neo4j.py · 240 行 · 初始化 → 写入 → 检索</text>

  <!-- ================= 左侧主流程 ================= -->
  <!-- Start pill -->
  <rect x="150" y="100" width="320" height="42" rx="21" fill="#1e293b" stroke="#64748b"/>
  <text x="310" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#cbd5e1">asyncio.run(main())　入口</text>
  <line x1="310" y1="142" x2="310" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段1 配置 -->
  <g filter="url(#shadow)"><rect x="90" y="170" width="440" height="72" rx="10" fill="#0b3b52" stroke="#22d3ee"/></g>
  <text x="108" y="194" font-size="14" font-weight="700" fill="#7dd3fc">① 配置 · 第30–54行</text>
  <text x="108" y="216" font-size="12.5" fill="#e0f2fe">load_dotenv() 读 .env</text>
  <text x="108" y="234" font-size="11.5" fill="#94c9dc">NEO4J_URI / USER / PASSWORD ＋ 隐含必需 OPENAI_API_KEY</text>
  <line x1="310" y1="242" x2="310" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段2 初始化 -->
  <g filter="url(#shadow)"><rect x="90" y="268" width="440" height="72" rx="10" fill="#312e5b" stroke="#a78bfa"/></g>
  <text x="108" y="292" font-size="14" font-weight="700" fill="#c4b5fd">② 初始化 · 第66–67行</text>
  <text x="108" y="314" font-size="12.5" fill="#e9e5ff">Graphiti(uri, user, password)</text>
  <text x="108" y="332" font-size="11.5" fill="#a5b4fc">组装 Neo4jDriver ＋ OpenAI LLM/Embedder ＋ CrossEncoder</text>
  <line x1="310" y1="340" x2="310" y2="364" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段3 写入循环 -->
  <g filter="url(#shadow)"><rect x="90" y="366" width="440" height="88" rx="10" fill="#14342a" stroke="#34d399"/></g>
  <text x="108" y="390" font-size="14" font-weight="700" fill="#6ee7b7">③ 写入 Episodes · 第81–127行</text>
  <text x="108" y="412" font-size="12.5" fill="#d1fae5">for episode in episodes:  await add_episode(...)</text>
  <text x="108" y="431" font-size="11.5" fill="#86c9a8">4 条 (2 text + 2 json)，每条触发写入管道 →</text>
  <text x="108" y="448" font-size="11" fill="#34d399">name · episode_body · source · source_description · reference_time</text>
  <line x1="530" y1="410" x2="612" y2="410" stroke="#34d399" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowP)"/>
  <line x1="310" y1="454" x2="310" y2="864" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段4 -->
  <g filter="url(#shadow)"><rect x="90" y="470" width="440" height="70" rx="10" fill="#3a2416" stroke="#fbbf24"/></g>
  <text x="108" y="494" font-size="14" font-weight="700" fill="#fcd34d">④ 基础混合检索 · 第138–151行</text>
  <text x="108" y="515" font-size="12.5" fill="#fde68a">graphiti.search("Who was the CA AG?")</text>
  <text x="108" y="532" font-size="11.5" fill="#d0a860">语义+BM25→RRF · 返回边(事实) 带 valid_at/invalid_at</text>

  <!-- 阶段5 -->
  <g filter="url(#shadow)"><rect x="90" y="558" width="440" height="70" rx="10" fill="#3a2416" stroke="#fbbf24"/></g>
  <text x="108" y="582" font-size="14" font-weight="700" fill="#fcd34d">⑤ 中心节点重排 · 第161–184行</text>
  <text x="108" y="603" font-size="12.5" fill="#fde68a">search(..., center_node_uuid=results[0].source_node_uuid)</text>
  <text x="108" y="620" font-size="11.5" fill="#d0a860">按图距离 (node distance) 重新排序</text>

  <!-- 阶段6 -->
  <g filter="url(#shadow)"><rect x="90" y="646" width="440" height="78" rx="10" fill="#3a2416" stroke="#fbbf24"/></g>
  <text x="108" y="670" font-size="14" font-weight="700" fill="#fcd34d">⑥ 配方搜节点 · 第195–223行</text>
  <text x="108" y="691" font-size="12.5" fill="#fde68a">_search(query, NODE_HYBRID_SEARCH_RRF.copy(limit=5))</text>
  <text x="108" y="708" font-size="11.5" fill="#d0a860">底层检索 · 返回 nodes(实体) 带 summary/labels/attributes</text>

  <!-- 阶段7 -->
  <g filter="url(#shadow)"><rect x="90" y="742" width="440" height="64" rx="10" fill="#1e293b" stroke="#475569"/></g>
  <text x="108" y="766" font-size="14" font-weight="700" fill="#cbd5e1">⑦ 清理 · 第225–239行</text>
  <text x="108" y="788" font-size="12.5" fill="#e2e8f0">finally: await graphiti.close()  释放 Neo4j 连接</text>

  <line x1="310" y1="540" x2="310" y2="556" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="628" x2="310" y2="644" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="724" x2="310" y2="740" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= 右侧：add_episode 写入管道详情 ================= -->
  <g filter="url(#shadow)"><rect x="620" y="170" width="500" height="440" rx="12" fill="#0f2f26" stroke="#10b981"/></g>
  <text x="644" y="200" font-size="15" font-weight="700" fill="#6ee7b7">add_episode 内部写入管道</text>
  <text x="644" y="220" font-size="11.5" fill="#4fbf8b">utils/maintenance · 每条 episode 都过一遍这 6 步</text>

  <g font-size="12.5">
    <rect x="644" y="234" width="452" height="52" rx="8" fill="#14342a" stroke="#059669"/>
    <text x="662" y="255" font-weight="700" fill="#a7f3d0">① 抽取 Extract</text>
    <text x="662" y="274" fill="#cbd5e1">LLM 从 text/json 抽出 实体(EntityNode) + 关系(EntityEdge)</text>

    <rect x="644" y="292" width="452" height="52" rx="8" fill="#14342a" stroke="#059669"/>
    <text x="662" y="313" font-weight="700" fill="#a7f3d0">② 去重 Dedup</text>
    <text x="662" y="332" fill="#cbd5e1">两条 "Gavin Newsom" → 精确 + 语义去重合并</text>

    <rect x="644" y="350" width="452" height="52" rx="8" fill="#14342a" stroke="#059669"/>
    <text x="662" y="371" font-weight="700" fill="#a7f3d0">③ 消解 Resolve</text>
    <text x="662" y="390" fill="#cbd5e1">与图中已存在实体/边对齐 (第3条对齐到第2条)</text>

    <rect x="644" y="408" width="452" height="52" rx="8" fill="#14342a" stroke="#059669"/>
    <text x="662" y="429" font-weight="700" fill="#a7f3d0">④ 时序 Temporal</text>
    <text x="662" y="448" fill="#cbd5e1">解析 "2011–2017" → valid_at/invalid_at · 矛盾旧边失效</text>

    <rect x="644" y="466" width="452" height="52" rx="8" fill="#14342a" stroke="#059669"/>
    <text x="662" y="487" font-weight="700" fill="#a7f3d0">⑤ 向量化 Embedding</text>
    <text x="662" y="506" fill="#cbd5e1">给实体名、关系事实生成 embedding</text>

    <rect x="644" y="524" width="452" height="52" rx="8" fill="#14342a" stroke="#059669"/>
    <text x="662" y="545" font-weight="700" fill="#a7f3d0">⑥ 落库 Persist</text>
    <text x="662" y="564" fill="#cbd5e1">写入 Neo4j + 建立 Episode→Entity 溯源边(EpisodicEdge)</text>
  </g>
  <g stroke="#34d399" stroke-width="1.5">
    <line x1="870" y1="286" x2="870" y2="292" marker-end="url(#arrowP)"/>
    <line x1="870" y1="344" x2="870" y2="350" marker-end="url(#arrowP)"/>
    <line x1="870" y1="402" x2="870" y2="408" marker-end="url(#arrowP)"/>
    <line x1="870" y1="460" x2="870" y2="466" marker-end="url(#arrowP)"/>
    <line x1="870" y1="518" x2="870" y2="524" marker-end="url(#arrowP)"/>
  </g>

  <!-- ================= 底部：两种检索对比 ================= -->
  <g filter="url(#shadow)"><rect x="620" y="646" width="500" height="160" rx="12" fill="#2a1f0f" stroke="#f59e0b"/></g>
  <text x="644" y="674" font-size="15" font-weight="700" fill="#fcd34d">search() vs _search() 对比</text>
  <g font-size="12">
    <text x="644" y="700" font-weight="700" fill="#fde68a">search()（高层，阶段④⑤）</text>
    <text x="644" y="719" fill="#cbd5e1">输入：一句 query（+可选 center_node_uuid）</text>
    <text x="644" y="736" fill="#cbd5e1">返回：边列表（事实）</text>
    <line x1="644" y1="748" x2="1096" y2="748" stroke="#7a5c1e" stroke-dasharray="3 3"/>
    <text x="644" y="768" font-weight="700" fill="#fde68a">_search()（底层，阶段⑥）</text>
    <text x="644" y="787" fill="#cbd5e1">输入：query + SearchConfig 配方对象</text>
    <text x="644" y="804" fill="#cbd5e1">返回：SearchResults(.nodes / .edges / .communities)</text>
  </g>

  <!-- ================= 底部说明条 ================= -->
  <g filter="url(#shadow)"><rect x="90" y="850" width="1030" height="270" rx="12" fill="#1e293b" stroke="#334155"/></g>
  <text x="112" y="880" font-size="15" font-weight="700" fill="#e2e8f0">关键要点</text>
  <g font-size="12.5" fill="#cbd5e1">
    <text x="112" y="908">• 全程异步：所有核心方法都要 await，asyncio.run(main()) 是实际启动点。</text>
    <text x="112" y="934">• 输入单位是 Episode：text 或 json 两种；JSON 内容必须先 json.dumps() 成字符串。</text>
    <text x="112" y="960">• reference_time = 事件发生时间（非写入时间），是双时序模型的输入源头。</text>
    <text x="112" y="986">• 4 条测试数据故意含两条同名 "Gavin Newsom" → 演示写入管道的去重与实体消解。</text>
    <text x="112" y="1012">• 检索结果带 valid_at / invalid_at 时间有效期——这是 Graphiti 区别于普通 RAG 的核心。</text>
    <text x="112" y="1038">• center_node_uuid 让排序利用图结构（node distance）；配方用 model_copy(deep=True) 后再改参数。</text>
    <text x="112" y="1064">• close() 放在 finally，保证异常时也能释放数据库连接。</text>
    <text x="112" y="1096" font-size="11.5" fill="#64748b">对应调用链：quickstart.py → Graphiti(门面) → add_episode(写入管道) / search(检索层) → driver → Neo4j</text>
  </g>

  <text x="600" y="1155" text-anchor="middle" font-size="11" fill="#475569">基于源码逐行分析 · 2026-07-03</text>
</svg>
