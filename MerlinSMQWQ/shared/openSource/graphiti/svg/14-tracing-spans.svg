<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="980" viewBox="0 0 1160 980" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="t_arrow" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="980" fill="#f8fafc"/>

  <text x="580" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#1e293b">Graphiti 分布式追踪 · OpenTelemetry</text>
  <text x="580" y="72" text-anchor="middle" font-size="14" fill="#64748b">Tracer 抽象：不配置就零开销，配置了就全链路可观测</text>

  <!-- concepts -->
  <rect x="40" y="92" width="1080" height="66" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="60" y="116" font-size="13" font-weight="700" fill="#1d4ed8">概念：Trace = 一次完整操作 ｜ Span = 其中一步（记 名字 + 起止时间 + 属性）｜ 层级树 = span 嵌套</text>
  <text x="60" y="140" font-size="11.5" fill="#475569">看这棵树就能一眼看出「总共 2 秒，其中 1.8 秒花在调 LLM 上」——排查慢查询、看耗时占比、定位报错环节</text>

  <!-- the fork -->
  <text x="40" y="192" font-size="16" font-weight="700" fill="#1e293b">一、唯一决策点 create_tracer —— 零开销 vs 全链路的分叉</text>

  <rect x="440" y="206" width="280" height="52" rx="10" fill="#1e293b"/>
  <text x="580" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">create_tracer(otel_tracer)</text>
  <text x="580" y="247" text-anchor="middle" font-size="10.5" fill="#cbd5e1">业务代码永远写 with tracer.start_span(...)</text>

  <line x1="500" y1="258" x2="320" y2="288" stroke="#475569" stroke-width="1.8" marker-end="url(#t_arrow)"/>
  <line x1="660" y1="258" x2="840" y2="288" stroke="#475569" stroke-width="1.8" marker-end="url(#t_arrow)"/>
  <text x="380" y="278" font-size="10.5" fill="#64748b">没传/没装OTel</text>
  <text x="720" y="278" font-size="10.5" fill="#64748b">传了真 tracer</text>

  <!-- NoOp branch -->
  <rect x="60" y="290" width="480" height="150" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="80" y="314" font-size="14" font-weight="700" fill="#475569">NoOpTracer（默认）</text>
  <text x="80" y="337" font-size="11" fill="#334155">每个方法体都是 pass —— 什么都不做</text>
  <rect x="80" y="348" width="440" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="92" y="367" font-size="10" fill="#64748b" font-family="monospace">def add_attributes(self, attrs): pass</text>
  <text x="92" y="384" font-size="10" fill="#64748b" font-family="monospace">def start_span(self, name): yield NoOpSpan()</text>
  <text x="80" y="414" font-size="11" font-weight="700" fill="#16a34a">✓ 零开销空转</text>
  <text x="80" y="432" font-size="10.5" fill="#475569">业务代码无需任何 if tracer 判断，靠多态</text>

  <!-- OTel branch -->
  <rect x="620" y="290" width="480" height="150" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="640" y="314" font-size="14" font-weight="700" fill="#6d28d9">OpenTelemetryTracer</text>
  <text x="640" y="337" font-size="11" fill="#334155">wrapper 把接口翻译成真 OTel SDK 调用</text>
  <text x="640" y="359" font-size="10.5" fill="#475569">• 自动加前缀：add_episode → graphiti.add_episode</text>
  <text x="640" y="378" font-size="10.5" fill="#475569">• start_as_current_span → 子 span 自动嵌套成树</text>
  <text x="640" y="397" font-size="10.5" fill="#475569">• 属性过滤 None、非基本类型转 str</text>
  <text x="640" y="418" font-size="11" font-weight="700" fill="#7c3aed">✓ 全链路可观测</text>
  <text x="640" y="434" font-size="10.5" fill="#b91c1c">所有调用 try/except 静默 → 追踪坏了不影响业务</text>

  <!-- span trees -->
  <text x="40" y="478" font-size="16" font-weight="700" fill="#1e293b">二、实际埋点的 span 层级树</text>

  <!-- add_episode tree -->
  <rect x="40" y="492" width="520" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <rect x="56" y="506" width="488" height="32" rx="6" fill="#1e293b"/>
  <text x="70" y="527" font-size="12.5" font-weight="700" fill="#ffffff">graphiti.add_episode（根 span）</text>
  <text x="70" y="558" font-size="11" fill="#6d28d9" font-family="monospace">├─ graphiti.llm.generate  (extract_nodes)</text>
  <text x="70" y="578" font-size="11" fill="#6d28d9" font-family="monospace">├─ graphiti.llm.generate  (dedupe/resolve)</text>
  <text x="70" y="598" font-size="11" fill="#6d28d9" font-family="monospace">├─ graphiti.llm.generate  (extract edges)</text>
  <text x="70" y="618" font-size="11" fill="#94a3b8" font-family="monospace">└─ ...</text>
  <line x1="56" y1="632" x2="544" y2="632" stroke="#e2e8f0"/>
  <text x="70" y="652" font-size="10.5" fill="#475569">根记：node.count · edge.count · invalidated_count</text>
  <text x="70" y="669" font-size="10.5" fill="#475569">　　　update_communities · duration_ms</text>
  <text x="70" y="689" font-size="10.5" fill="#475569">llm.generate 记：provider · model.size · cache.hit</text>
  <text x="70" y="704" font-size="10" fill="#94a3b8">→ 看得到调了几次 LLM、命中缓存没、每次多久</text>

  <!-- search tree -->
  <rect x="580" y="492" width="520" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <rect x="596" y="506" width="488" height="32" rx="6" fill="#0f766e"/>
  <text x="610" y="527" font-size="12.5" font-weight="700" fill="#ffffff">graphiti.search.execute_scopes（四路并行）</text>
  <text x="610" y="558" font-size="11" fill="#0f766e" font-family="monospace">├─ search.edge_search</text>
  <text x="610" y="576" font-size="10" fill="#0d9488" font-family="monospace">│   ├─ execute_methods (多路召回)</text>
  <text x="610" y="592" font-size="10" fill="#0d9488" font-family="monospace">│   └─ rerank → compute_mmr / cross_encoder</text>
  <text x="610" y="610" font-size="11" fill="#0f766e" font-family="monospace">├─ search.node_search</text>
  <text x="610" y="628" font-size="11" fill="#0f766e" font-family="monospace">├─ search.episode_search</text>
  <text x="610" y="646" font-size="11" fill="#0f766e" font-family="monospace">└─ search.community_search</text>
  <line x1="596" y1="658" x2="1084" y2="658" stroke="#e2e8f0"/>
  <text x="610" y="678" font-size="10.5" fill="#475569">约 30+ 细分 span，每个记：candidate_count ·</text>
  <text x="610" y="694" font-size="10.5" fill="#475569">reranked_count · returned_count · reranker · 耗时</text>
  <text x="610" y="708" font-size="10" fill="#94a3b8">→ 定位是某路召回慢还是重排慢</text>

  <!-- _trace_phase -->
  <text x="40" y="748" font-size="16" font-weight="700" fill="#1e293b">三、_trace_phase 埋点小助手（search 用）</text>
  <rect x="40" y="762" width="640" height="140" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="60" y="786" font-size="11" fill="#475569" font-family="monospace">with tracer.start_span(name) as span:</text>
  <text x="60" y="805" font-size="11" fill="#475569" font-family="monospace">    span.add_attributes(attrs)      # 进入即打属性</text>
  <text x="60" y="824" font-size="11" fill="#475569" font-family="monospace">    try:</text>
  <text x="60" y="843" font-size="11" fill="#475569" font-family="monospace">        yield span; span.set_status('ok')</text>
  <text x="60" y="862" font-size="11" fill="#475569" font-family="monospace">    except: set_status('error'); record_exception; raise</text>
  <text x="60" y="890" font-size="11" fill="#6d28d9">把「开 span→打属性→标 ok/error+记异常→re-raise」封装成一行</text>

  <!-- how to use -->
  <rect x="700" y="762" width="400" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="720" y="786" font-size="12.5" font-weight="700" fill="#1d4ed8">用户怎么接入</text>
  <text x="720" y="808" font-size="10.5" fill="#475569" font-family="monospace">Graphiti(..., tracer=otel_tracer,</text>
  <text x="720" y="824" font-size="10.5" fill="#475569" font-family="monospace">  trace_span_prefix='myapp')</text>
  <text x="720" y="850" font-size="10.5" fill="#334155">不传 → NoOpTracer 零开销</text>
  <text x="720" y="868" font-size="10.5" fill="#334155">传了 → 自动分发到 LLM 客户端 + search</text>
  <text x="720" y="888" font-size="10.5" fill="#64748b">导出到 Jaeger / Tempo / Datadog…</text>

  <!-- footer -->
  <rect x="40" y="918" width="1060" height="46" rx="10" fill="#1e293b"/>
  <text x="60" y="940" font-size="12.5" font-weight="700" fill="#ffffff">💡 一句话</text>
  <text x="150" y="940" font-size="11.5" fill="#cbd5e1">业务只依赖抽象、无 if 判断；create_tracer 一处分叉决定空转还是真追踪；所有追踪调用 try/except 静默，永不影响业务正确性。</text>
</svg>
